<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a3a2a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2d5a3d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f2318;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#c9a84c;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#c9a84c;stop-opacity:0" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="800" height="400" fill="url(#bg)" />
  <!-- Sky glow -->
  <ellipse cx="400" cy="80" rx="300" ry="120" fill="url(#glow)" />
  <!-- Mountain silhouettes -->
  <polygon points="0,300 120,160 240,280 300,200 400,140 500,210 580,170 680,260 800,220 800,400 0,400" fill="#0a1a10" opacity="0.9"/>
  <polygon points="0,320 80,210 180,290 260,230 360,180 440,240 540,200 640,270 740,230 800,260 800,400 0,400" fill="#071510" opacity="0.7"/>
  <!-- Temple silhouette (White Temple inspired) -->
  <g transform="translate(340, 100)" opacity="0.85">
    <!-- Main spire -->
    <polygon points="30,0 60,120 0,120" fill="#e8dfc8" opacity="0.9"/>
    <!-- Secondary spires -->
    <polygon points="10,40 30,120 -10,120" fill="#d4c9a8" opacity="0.7"/>
    <polygon points="50,40 70,120 30,120" fill="#d4c9a8" opacity="0.7"/>
    <!-- Base -->
    <rect x="-20" y="110" width="100" height="12" fill="#c9b87a" opacity="0.8"/>
    <rect x="-30" y="122" width="120" height="8" fill="#b8a060" opacity="0.7"/>
  </g>
  <!-- Stars -->
  <circle cx="100" cy="60" r="1.5" fill="white" opacity="0.7"/>
  <circle cx="180" cy="40" r="1" fill="white" opacity="0.5"/>
  <circle cx="280" cy="80" r="1.5" fill="white" opacity="0.6"/>
  <circle cx="550" cy="50" r="1" fill="white" opacity="0.5"/>
  <circle cx="650" cy="70" r="1.5" fill="white" opacity="0.7"/>
  <circle cx="720" cy="35" r="1" fill="white" opacity="0.4"/>
  <!-- Overlay gradient for text -->
  <linearGradient id="overlay" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" style="stop-color:transparent" />
    <stop offset="70%" style="stop-color:rgba(0,0,0,0.5)" />
  </linearGradient>
  <rect width="800" height="400" fill="url(#overlay)" />
  <!-- Location name -->
  <text x="400" y="345" font-family="Georgia, serif" font-size="36" font-weight="bold" fill="#c9a84c" text-anchor="middle" letter-spacing="6">CHIANG RAI</text>
  <text x="400" y="375" font-family="Arial, sans-serif" font-size="13" fill="#e8dfc8" text-anchor="middle" letter-spacing="4" opacity="0.8">TEMPLES &amp; TRIBES</text>
</svg>
